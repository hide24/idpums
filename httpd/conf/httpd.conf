#Rewrite Rules
#Force SSL
RewriteEngine on
ReWriteCond %{SERVER_PORT} !^443$
RewriteRule ^/(.*) https://%{HTTP_HOST}/$1 [NC,R,L]

ServerName __host_name__

<VirtualHost *:443>
    DocumentRoot "/var/www/html"

    SSLEngine on

    #Disable CRIME vulernability v2.4+
    SSLCompression off

    #Clean SSL Issues and enable perfect forward secrecy
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder on
    SSLCipherSuite "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 \
EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 \
EECDH EDH+aRSA !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS !RC4"

    #SSL Cert Stuff
    SSLCertificateFile    /opt/httpd/certs/idp.cer
    SSLCertificateKeyFile /opt/httpd/certs/idp.key

    SSLProxyEngine on
    #Bypassing certicate checking on self-signed client cert
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off

    ProxyPreserveHost on
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS
    RequestHeader set REMOTE-USER %{REMOTE_USER}s

    #Map /idp to jetty
    ProxyPass /idp https://idp:4443/idp
    ProxyPassReverse /idp https://idp:4443/idp

    #Map to test SP
#    ProxyPass /Shibboleth.sso http://sp/Shibboleth.sso
#    ProxyPassReverse /Shibboleth.sso http://sp/Shibboleth.sso
#    ProxyPass /secure http://sp/secure

    #Map to TiQR
    ProxyPass /Shibboleth.sso http://tiqr/Shibboleth.sso
    ProxyPassReverse /Shibboleth.sso http://tiqr/Shibboleth.sso
    ProxyPass /tiqr http://tiqr/tiqr
    ProxyPassReverse /tiqr http://tiqr/tiqr

    #Map to UMS
    ProxyPass / http://ums/
    ProxyPassReverse / http://ums/

</VirtualHost>

